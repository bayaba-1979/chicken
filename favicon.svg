<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1410"/>
      <stop offset="50%" style="stop-color:#2d1f18"/>
      <stop offset="100%" style="stop-color:#1a1410"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0c080"/>
      <stop offset="40%" style="stop-color:#e8a850"/>
      <stop offset="60%" style="stop-color:#d4893a"/>
      <stop offset="100%" style="stop-color:#c67e3c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 배경 -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <!-- 테두리 -->
  <rect x="12" y="12" width="488" height="488" rx="112" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.6"/>
  <!-- 내부 글로우 -->
  <rect x="30" y="30" width="452" height="452" rx="96" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.3"/>
  <!-- 치 문자 -->
  <text x="256" y="330" text-anchor="middle" font-family="'Noto Serif KR','Apple SD Gothic Neo',serif" font-size="260" font-weight="900" fill="url(#gold)" filter="url(#glow)" letter-spacing="-0.04em">치</text>
  <!-- 장식 도트 -->
  <circle cx="160" cy="130" r="6" fill="#e8a850" opacity="0.5"/>
  <circle cx="352" cy="130" r="6" fill="#e8a850" opacity="0.5"/>
  <circle cx="160" cy="390" r="6" fill="#d4893a" opacity="0.3"/>
  <circle cx="352" cy="390" r="6" fill="#d4893a" opacity="0.3"/>
</svg>
